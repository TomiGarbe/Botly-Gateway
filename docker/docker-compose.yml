name: evolution

services:
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution_api
    restart: unless-stopped
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    env_file:
      - ../config/.env
    environment:
      # Base
      SERVER_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_COLOR: "true"
      # Logs de Baileys (librería de WhatsApp): fatal|error|warn|info|debug|trace|silent
      LOG_BAILEYS: debug
      # Base de datos
      # DATABASE_CONNECTION_URI es la variable que Evolution v2 lee internamente
      # DATABASE_URL es la que usa Prisma — ambas deben apuntar a "postgres" (service name), no localhost
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      # Redis
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "true"
      # Auth
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      # Instancias
      DEL_INSTANCE: "false"
      CONFIG_SESSION_PHONE_CLIENT: "Evolution API"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
      # WhatsApp Cloud (canal meta). Sin estas variables Evolution usa sus
      # defaults: Graph API v18.0 (EXPIRADA) y el verify token publico "evolution".
      WA_BUSINESS_URL: https://graph.facebook.com
      WA_BUSINESS_VERSION: ${META_GRAPH_VERSION:-v23.0}
      WA_BUSINESS_TOKEN_WEBHOOK: ${WA_BUSINESS_TOKEN_WEBHOOK:?definir en config/.env}
      WA_BUSINESS_LANGUAGE: ${WA_BUSINESS_LANGUAGE:-es}
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - evolution_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17
    container_name: evolution_postgres
    restart: unless-stopped
    ports:
      # Izquierda = puerto del host (5433 por defecto, para no pisar al otro stack
      # del VPS). Derecha = puerto interno del contenedor, siempre 5432: es el que
      # usan los demas servicios via DATABASE_URL (postgres:5432).
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evolution_net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  redis:
    image: redis:7
    container_name: evolution_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evolution_net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  gateway:
    build:
      context: ../gateway
      dockerfile: Dockerfile
      args:
        GATEWAY_GIT_SHA: ${GATEWAY_GIT_SHA:-unknown}
        GATEWAY_BUILD_VERSION: ${GATEWAY_BUILD_VERSION:-unknown}
    container_name: evolution_gateway
    restart: unless-stopped
    ports:
      # Solo loopback: el acceso publico entra por Nginx con TLS. Publicarlo en
      # 0.0.0.0 dejaba el gateway accesible por HTTP plano en el puerto 9000.
      - "127.0.0.1:${GATEWAY_PORT:-9000}:9000"
    env_file:
      - ../config/.env
    environment:
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ALLOWED_GOOGLE_USERS: ${ALLOWED_GOOGLE_USERS:-}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-28800}
      GATEWAY_USERS_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      INITIAL_ADMIN_NAME: ${INITIAL_ADMIN_NAME:-Botly Administrator}
      META_REVIEW_EMAIL: ${META_REVIEW_EMAIL:-}
      META_REVIEW_PASSWORD: ${META_REVIEW_PASSWORD:-}
      META_REVIEW_NAME: ${META_REVIEW_NAME:-Meta Review}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://gateway-server.botly.com.ar}
      # Browser SPA origin. Do not reuse PUBLIC_APP_URL: that remains the
      # canonical Gateway/public webhook URL.
      FRONTEND_APP_URL: ${FRONTEND_APP_URL:-https://gateway.botly.com.ar}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://gateway.botly.com.ar,http://localhost:5174,http://127.0.0.1:5174}
      CORS_ALLOW_ORIGIN_REGEX: ${CORS_ALLOW_ORIGIN_REGEX:-https?://(localhost|127\.0\.0\.1)(:\d+)?}
      CORS_DEBUG: ${CORS_DEBUG:-false}
      FEATURE_PROVIDER_EVOLUTION: ${FEATURE_PROVIDER_EVOLUTION:-false}
      FEATURE_PROVIDER_BAILEYS: ${FEATURE_PROVIDER_BAILEYS:-false}
      FEATURE_WHATSAPP_WEB: ${FEATURE_WHATSAPP_WEB:-false}
      FEATURE_QR_LOGIN: ${FEATURE_QR_LOGIN:-false}
      FEATURE_INSTAGRAM: ${FEATURE_INSTAGRAM:-true}
      FEATURE_WHATSAPP_CLOUD: ${FEATURE_WHATSAPP_CLOUD:-true}
      EVOLUTION_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:-}
      EVOLUTION_WEBHOOK_URL: ${EVOLUTION_WEBHOOK_URL:-http://gateway:9000/webhooks/evolution}
      # Fallback target when an instance has no explicit webhook. Explicit
      # instance webhooks must use the same Docker-internal URL.
      BOT_WEBHOOK_URL: ${BOT_WEBHOOK_URL:-http://botly-api:8000/api/v1/webhook/inbound}
      ENABLE_GROUP_MESSAGES: ${ENABLE_GROUP_MESSAGES:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      INSTANCE_API_KEYS_PATH: /var/lib/botly/instance_api_keys.json
      INSTANCE_WEBHOOKS_PATH: /var/lib/botly/instance_webhooks.json
      INSTANCE_WEBHOOKS_ENCRYPTION_KEY: ${INSTANCE_WEBHOOKS_ENCRYPTION_KEY:-}
      WEBHOOK_DELIVERIES_PATH: /var/lib/botly/webhooks/deliveries.json
      WEBHOOK_DELIVERY_RETENTION: ${WEBHOOK_DELIVERY_RETENTION:-250}
      WEBHOOK_DELIVERY_MAX_PAYLOAD_BYTES: ${WEBHOOK_DELIVERY_MAX_PAYLOAD_BYTES:-16384}
      MEDIA_CACHE_DIR: /var/lib/botly/media_cache
      # Deben vivir en el volumen persistente: los defaults apuntan a /tmp y las
      # credenciales oficiales se perderian al recrear el contenedor.
      CONNECTION_METADATA_PATH: /var/lib/botly/connection_metadata.json
      CONNECTION_REGISTRY_PATH: ${CONNECTION_REGISTRY_PATH:-/var/lib/botly/connections/connection_registry.json}
      CONNECTION_SETUP_TTL_SECONDS: ${CONNECTION_SETUP_TTL_SECONDS:-3600}
      CONNECTION_SETUP_CLEANUP_INTERVAL_SECONDS: ${CONNECTION_SETUP_CLEANUP_INTERVAL_SECONDS:-60}
      AUTH_SESSIONS_PATH: /var/lib/botly/gateway_sessions.json
      OFFICIAL_CREDENTIALS_PATH: /var/lib/botly/official_credentials.json
      WEBHOOK_EVENTS_PATH: /var/lib/botly/webhook_events.json
      ALERTS_PATH: /var/lib/botly/alerts.json
      AUTOMATIONS_PATH: /var/lib/botly/automations.json
      OPERATIONS_PATH: /var/lib/botly/operations.json
      OFFICIAL_CREDENTIALS_ENCRYPTION_KEY: ${OFFICIAL_CREDENTIALS_ENCRYPTION_KEY:-}
      PROVIDER_CREDENTIALS_ENCRYPTION_KEY: ${PROVIDER_CREDENTIALS_ENCRYPTION_KEY:-}
      INSTAGRAM_OAUTH_STATE_PATH: /var/lib/botly/oauth/instagram_states.json
      CORE_INBOUND_URL: ${CORE_INBOUND_URL:-http://botly-api:8000/api/v1/webhook/inbound}
      CORE_CONTROL_PLANE_URL: ${CORE_CONTROL_PLANE_URL:-}
      GATEWAY_CONTROL_PLANE_API_KEY: ${GATEWAY_CONTROL_PLANE_API_KEY:-}
      CORE_CONTROL_PLANE_TIMEOUT_SECONDS: ${CORE_CONTROL_PLANE_TIMEOUT_SECONDS:-10}
      CORE_CHANNEL_CREDENTIALS_PATH: ${CORE_CHANNEL_CREDENTIALS_PATH:-/var/lib/botly/core/core_channel_credentials.json}
      CORE_CHANNEL_CREDENTIALS_ENCRYPTION_KEY: ${CORE_CHANNEL_CREDENTIALS_ENCRYPTION_KEY:-}
      CORE_INBOUND_DELIVERIES_PATH: ${CORE_INBOUND_DELIVERIES_PATH:-/var/lib/botly/core/inbound_deliveries.json}
      CORE_INBOUND_DELIVERY_MAX_ATTEMPTS: ${CORE_INBOUND_DELIVERY_MAX_ATTEMPTS:-5}
      CORE_INBOUND_DELIVERY_BACKOFF_BASE_SECONDS: ${CORE_INBOUND_DELIVERY_BACKOFF_BASE_SECONDS:-5}
      CORE_INBOUND_DELIVERY_POLL_SECONDS: ${CORE_INBOUND_DELIVERY_POLL_SECONDS:-2}
      CORE_INBOUND_DELIVERY_BATCH_SIZE: ${CORE_INBOUND_DELIVERY_BATCH_SIZE:-25}
      CORE_INBOUND_DELIVERY_LEASE_SECONDS: ${CORE_INBOUND_DELIVERY_LEASE_SECONDS:-60}
      CORE_INBOUND_DISPATCHER_ENABLED: ${CORE_INBOUND_DISPATCHER_ENABLED:-true}
      META_ONBOARDING_PATH: /var/lib/botly/meta_onboarding.json
      META_RESOURCES_PATH: /var/lib/botly/meta_resources.json
      CHANNEL_RECORDS_PATH: /var/lib/botly/channel_records.json
      # Meta / WhatsApp Cloud — Embedded Signup con Configuration ID
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_EMBEDDED_SIGNUP_CONFIG_ID: ${META_EMBEDDED_SIGNUP_CONFIG_ID:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v23.0}
      META_SIGNUP_TIMEOUT_SECONDS: ${META_SIGNUP_TIMEOUT_SECONDS:-30}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      META_WEBHOOK_REQUIRE_SIGNATURE: ${META_WEBHOOK_REQUIRE_SIGNATURE:-true}
      # Instagram Login uses its own app ID; META_APP_ID remains for Meta/WhatsApp.
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID:-}
      META_REDIRECT_URI: ${META_REDIRECT_URI:-}
      INSTAGRAM_OAUTH_SCOPES: ${INSTAGRAM_OAUTH_SCOPES:-instagram_business_basic,instagram_business_manage_messages}
      INSTAGRAM_OAUTH_AUTHORIZE_URL: ${INSTAGRAM_OAUTH_AUTHORIZE_URL:-https://www.instagram.com/oauth/authorize}
      INSTAGRAM_OAUTH_TOKEN_URL: ${INSTAGRAM_OAUTH_TOKEN_URL:-https://api.instagram.com/oauth/access_token}
      INSTAGRAM_GRAPH_API_URL: ${INSTAGRAM_GRAPH_API_URL:-https://graph.instagram.com}
      # Trazabilidad temporal de payloads Meta; contiene contenido de clientes.
      # Activar solamente durante el diagnóstico y volver a false al terminar.
      WEBHOOK_DEBUG: ${WEBHOOK_DEBUG:-false}
    volumes:
      - gateway_data:/var/lib/botly
    depends_on:
      evolution:
        condition: service_started
    networks:
      - evolution_net
      - botly-shared
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  evolution_instances:
    name: evolution_instances_data
  postgres_data:
    name: evolution_postgres_data
  redis_data:
    name: evolution_redis_data
  gateway_data:
    name: evolution_gateway_data

networks:
  evolution_net:
    name: evolution_net
    driver: bridge
    driver_opts:
      # WSL2 en Windows tiene overhead extra — MTU 1500 fragmenta paquetes grandes
      # y el WebSocket de WhatsApp los descarta. 1450 es el valor seguro para WSL2.
      com.docker.network.driver.mtu: "1450"
  botly-shared:
    external: true
    name: ${BOTLY_SHARED_NETWORK:-botly-shared}
